<!doctype html>
<!-- Página de «no existe» de GitHub Pages. Se sirve en cualquier dirección del sitio que no exista,
     también en subcarpetas, así que no puede usar rutas relativas: lleva su propio estilo (los colores
     de estilo/tokens.css, escritos aquí) y enlaces absolutos a la portada y al mapa. -->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página no encontrada · De renta en renta</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="https://gastiaso.github.io/de-renta-en-renta/estilo/fichas/llave.svg" type="image/svg+xml">
  <style>
    html, body { height: 100%; margin: 0; }
    body { display: flex; padding: 12px; box-sizing: border-box; background: #2b2b2b; font: 16px/1.4 "Arial Narrow", Arial, sans-serif; color: #2b2b2b; }
    main { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 24px; background: #f6efe0; border: 4px solid #2b2b2b; border-radius: 6px; }
    .marca { margin: 0 0 24px; font: 800 1.6rem/1.1 Futura, "Century Gothic", sans-serif; letter-spacing: 0.03em; text-transform: uppercase; color: #b8322a; }
    h1 { margin: 0 0 8px; font: 700 1.4rem/1.2 Futura, "Century Gothic", sans-serif; }
    p { margin: 0 0 8px; max-width: 60ch; }
    .enlaces { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
    .enlaces a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 14px; border: 2px solid #2b2b2b; border-radius: 4px; background: #fffaf0; color: #2b2b2b; font-weight: 600; text-decoration: none; }
    .enlaces a:hover { background: #2b2b2b; color: #f6efe0; }
    a:focus-visible { outline: 3px solid #b8322a; outline-offset: 2px; }
    [lang="en"] { color: #5c554b; }
  </style>
</head>
<body>
  <main>
    <p class="marca">De renta en renta</p>
    <h1>Esta página no existe</h1>
    <p>La dirección no corresponde a ninguna página del sitio. Puede que el enlace esté mal escrito o que la página haya cambiado de sitio.</p>
    <p lang="en">This page does not exist: the address matches no page on this site.</p>
    <div class="enlaces">
      <a href="https://gastiaso.github.io/de-renta-en-renta/">Portada</a>
      <a href="https://gastiaso.github.io/de-renta-en-renta/mapa.html">Mapa</a>
      <a href="https://gastiaso.github.io/de-renta-en-renta/?idioma=en" lang="en" hreflang="en">Home (English)</a>
    </div>
  </main>
</body>
</html>
