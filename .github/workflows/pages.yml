# Publicación de la web en GitHub Pages (docs/publicacion.md; plan §6.6 y §11, preguntas 16 y 21).
#
# Monta el sitio con web/ tal como está en git y le añade, del último release del repositorio, lo
# que no entra en git:
#   - datos_web.tar.gz   → datos/      (exportación del pipeline, sin la muestra de datos/ejemplo/)
#   - <mapa base>.pmtiles → teselas/   (la ruta la dice el manifiesto: mapa_base.url)
#   - tabla_larga.parquet → descargas/ (descarga de la página «Datos»)
#   - version.json        → descargas/ (fecha, commit, versiones de las fuentes y cobertura por
#                           indicador; rellena la caja de descarga de la página «Datos»)
# La capa de portales (indicador 13) no viaja en el release: el sitio la lleva apagada
# (datos/portales/manifiesto.json).
# Los ficheros del release los prepara empaquetar_publicacion() (R/publicar.R), con SHA256SUMS.
#
# Sin secretos: usa el token que GitHub da a cada ejecución, con permisos mínimos por trabajo.
# Sin nombre de repositorio fijo: lo toma de la ejecución (GITHUB_REPOSITORY).
# Acciones oficiales de GitHub fijadas por commit, con su versión en el comentario.

name: Publicar en Pages

# Un push a main no publica nada (plan §11, pregunta 42). Se lanza a mano y monta el código y la
# nota de la referencia `ref` con los datos del último release: por defecto, el commit de la última
# publicación, la v0.4.0 (e04c643; decisión del autor, 10-nov-2026). Del 9 al 10-nov-2026 el sitio
# estuvo congelado en la v0.1 (cdd9892).
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit o etiqueta del código y la nota que se publican
        required: true
        default: e04c643a4fa5b7927ee3266327685e127746af2b

permissions: {}

# Una publicación cada vez; la que está en marcha no se cancela.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  montar:
    name: Montar el sitio
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Copiar el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Bajar los ficheros del último release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rel="$RUNNER_TEMP/release"
          mkdir -p "$rel"
          if ! gh release view --repo "$GITHUB_REPOSITORY" --json tagName > /dev/null; then
            echo "::error::No hay ningún release publicado: hay que crearlo antes (docs/publicacion.md)."
            exit 1
          fi
          gh release download --repo "$GITHUB_REPOSITORY" --dir "$rel" \
            --pattern SHA256SUMS --pattern version.json --pattern datos_web.tar.gz \
            --pattern tabla_larga.parquet --pattern '*.pmtiles'
          gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName > "$RUNNER_TEMP/etiqueta"
          ls -l "$rel"

      - name: Comprobar las sumas SHA-256
        working-directory: ${{ runner.temp }}/release
        run: |
          for f in SHA256SUMS version.json datos_web.tar.gz tabla_larga.parquet; do
            [ -f "$f" ] || { echo "::error::Falta $f en el release."; exit 1; }
          done
          for f in version.json datos_web.tar.gz tabla_larga.parquet *.pmtiles; do
            grep -q "  $f\$" SHA256SUMS || { echo "::error::SHA256SUMS no trae la suma de $f."; exit 1; }
          done
          sha256sum --check --strict SHA256SUMS

      - name: Montar el sitio
        run: |
          rel="$RUNNER_TEMP/release"
          sitio="$RUNNER_TEMP/sitio"
          cp -R web "$sitio"
          # Herramientas de desarrollo: no se publican
          rm -rf "$sitio/LEEME.md" "$sitio/servir.mjs" "$sitio/herramientas"

          # Datos de la web: solo rutas bajo datos/, sin la muestra (va en git), sin la capa de portales
          # (solo web, fuera del paquete) y sin subir de carpeta
          tar -tzf "$rel/datos_web.tar.gz" > "$RUNNER_TEMP/lista_datos.txt"
          if grep -v -E '^datos/' "$RUNNER_TEMP/lista_datos.txt" | grep -q . \
             || grep -E '^datos/ejemplo/|^datos/portales/|(^|/)\.\.(/|$)' "$RUNNER_TEMP/lista_datos.txt" | grep -q .; then
            echo "::error::datos_web.tar.gz lleva rutas fuera de datos/, la muestra de datos/ejemplo/ o la capa de portales."
            exit 1
          fi
          tar -xzf "$rel/datos_web.tar.gz" -C "$sitio" --no-same-owner --no-same-permissions

          # Capa de portales (indicador 13): no viaja en el release. Mientras no se decida cómo se
          # monta (docs/publicacion.md, «Capa de portales»), el sitio la lleva apagada: la web lee
          # este manifiesto y no pide nada más.
          mkdir -p "$sitio/datos/portales"
          printf '%s\n' '{"capa":"portales","activa":false}' > "$sitio/datos/portales/manifiesto.json"

          # El manifiesto de la exportación dice dónde va el mapa base
          manifiesto="$sitio/datos/manifiesto.json"
          jq -e '.ejemplo == false and .mapa_base.tipo == "pmtiles"' "$manifiesto" > /dev/null \
            || { echo "::error::El manifiesto no es el de una exportación real con mapa base PMTiles."; exit 1; }
          url=$(jq -r .mapa_base.url "$manifiesto")
          case "$url" in
            teselas/*.pmtiles) ;;
            *) echo "::error::Ruta del mapa base inesperada en el manifiesto: $url"; exit 1 ;;
          esac
          [ -f "$rel/$(basename "$url")" ] || { echo "::error::El release no trae $(basename "$url")."; exit 1; }
          mkdir -p "$sitio/teselas" "$sitio/descargas"
          cp "$rel/$(basename "$url")" "$sitio/$url"
          cp "$rel/tabla_larga.parquet" "$rel/version.json" "$sitio/descargas/"

      # Páginas de texto, en HTML y con la cabecera de la web. «Método»: la nota metodológica (docs/).
      # «Datos»: docs/datos.md y docs/data.md con la descarga, la cita y la cobertura rellenas desde
      # descargas/version.json (el del release) y CITATION.cff, más el diccionario que genera R desde
      # el inventario (web/herramientas/pagina_datos.mjs). Los textos compartidos (título, subtítulo,
      # menú) salen de los diccionarios de web/i18n/.
      - name: Páginas «Método» y «Datos»
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends pandoc > /dev/null
          pandoc --version | head -n 1
          echo "node $(node --version)"
          sitio="$RUNNER_TEMP/sitio"
          etiqueta=$(cat "$RUNNER_TEMP/etiqueta")
          for par in "es metodologia.md metodo.html datos.md datos_diccionario.md datos.html" \
                     "en methodology.md method.html data.md data_dictionary.md data.html"; do
            set -- $par
            dic="web/i18n/$1.json"
            comunes=(--from gfm --to html5 --standalone --toc --toc-depth 2 --wrap none
              --template web/herramientas/plantilla_documento.html
              --metadata-file "web/herramientas/documento_$1.yaml"
              --metadata titulo="$(jq -r .sitio.titulo "$dic")"
              --metadata subtitulo="$(jq -r .sitio.subtitulo "$dic")"
              --metadata texto_mapa="$(jq -r .nav.mapa "$dic")"
              --metadata texto_tu_sueldo="$(jq -r .nav.tu_sueldo "$dic")"
              --metadata texto_sobrecarga="$(jq -r .nav.sobrecarga "$dic")"
              --metadata texto_datos="$(jq -r .nav.datos "$dic")"
              --metadata texto_metodo="$(jq -r .nav.metodo "$dic")"
              --metadata texto_historico="$(jq -r '.nav.historico // empty' "$dic")"
              --metadata texto_navegacion="$(jq -r .interfaz.navegacion "$dic")"
              --metadata texto_idioma="$(jq -r .interfaz.idioma "$dic")")
            pandoc "docs/$2" "${comunes[@]}" --output "$sitio/$3"

            # La página «Datos» llegó después de la v0.1: con una referencia anterior, no se monta.
            if [ ! -f web/herramientas/pagina_datos.mjs ] || [ ! -f "docs/$4" ]; then
              echo "Sin página «Datos» en esta referencia: solo $3."
              continue
            fi
            node web/herramientas/pagina_datos.mjs --idioma "$1" --nota "docs/$4" --diccionario "docs/$5" \
              --version "$sitio/descargas/version.json" --cita CITATION.cff \
              --etiqueta "$etiqueta" --repositorio "$GITHUB_REPOSITORY" --salida "$RUNNER_TEMP/datos_$1.md"
            pandoc "$RUNNER_TEMP/datos_$1.md" "${comunes[@]}" \
              --metadata-file "web/herramientas/datos_$1.yaml" --output "$sitio/$6"
            grep -q 'descargas/tabla_larga.parquet' "$sitio/$6" \
              || { echo "::error::La página $6 no enlaza la tabla larga."; exit 1; }
            # datos_<idioma>.yaml, el último --metadata-file, debe mandar sobre documento_<idioma>.yaml
            grep -q "href=\"$6\" aria-current=\"page\"" "$sitio/$6" \
              || { echo "::error::La página $6 no lleva sus metadatos (datos_$1.yaml)."; exit 1; }
          done

      - name: Comprobar los límites de Pages
        env:
          REF_SITIO: ${{ inputs.ref }}
        run: |
          sitio="$RUNNER_TEMP/sitio"
          total=$(find "$sitio" -type f -printf '%s\n' | awk '{s += $1} END {print s + 0}')
          ficheros=$(find "$sitio" -type f | wc -l)
          echo "Sitio: $ficheros ficheros, $total bytes"
          [ "$total" -lt 1000000000 ] || { echo "::error::El sitio pasa de 1 GB (límite de Pages)."; exit 1; }
          grandes=$(find "$sitio" -type f -size +104857600c)
          [ -z "$grandes" ] || { echo "::error::Ficheros de más de 100 MiB: $grandes"; exit 1; }
          enlaces=$(find "$sitio" -type l)
          [ -z "$enlaces" ] || { echo "::error::Pages no admite enlaces simbólicos: $enlaces"; exit 1; }
          {
            echo "### Sitio montado"
            echo
            echo "- Release: \`$(cat "$RUNNER_TEMP/etiqueta")\`"
            echo "- Datos generados el $(jq -r .fecha "$sitio/descargas/version.json"), commit \`$(jq -r .commit.id "$sitio/descargas/version.json")\`"
            echo "- Web y nota del commit \`$(git rev-parse HEAD)\` (referencia \`$REF_SITIO\`)"
            echo "- $ficheros ficheros, $(( total / 1000000 )) MB"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Subir el sitio
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/sitio

  desplegar:
    name: Publicar en Pages
    needs: montar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Publicar
        id: despliegue
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
